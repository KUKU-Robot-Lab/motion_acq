# Station rig for arm5080. Select with: MACQ_STATION=arm5080 macq <command>
# STEP 1 scope: Meta Quest -> OpenArm arms (J1-J7) only. The OpenArm J8
# gripper motor is not connected; the end effector is RH56F1 (both arms, to be connected, controlled outside motion_acq).
# Values marked VERIFY must be checked on the station before real teleop.

station: arm5080

cameras: {}

recording:
  device: meta
  cameras: []
  fps: 30
  robot: openarmv1

robots:
  openarmv1:
    backend: openarm_can
    gripper:
      enabled: false
    can:
      # arm5080: one PCAN-USB Pro FD, ch1 = can0 and ch2 = can1 (no udev renames).
      # Same convention as arm4090 (can0 = right, can1 = left). VERIFY the wiring
      # with openarm-can-cli show_param before real teleop.
      fd: true
      bitrate: 1000000
      dbitrate: 5000000
      left_port: can1
      right_port: can0
      auto_repair: true

meta_quest:
  connection:
    quest_ip: ""  # VERIFY: set this station's Quest IP; until then pass --quest-ip
    tcp_port: 65432
    sync_port: 42000
    connect_retry_s: 1.0
  health:
    frame_stale_timeout_s: 0.25
