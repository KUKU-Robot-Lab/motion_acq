# Station rig for arm5080. Select with: MACQ_STATION=arm5080 macq <command>
# STEP 1 scope: Meta Quest -> OpenArm arms (J1-J7) only. The OpenArm J8
# gripper motor is not connected; the end effector is RH56F1 (both arms, to be connected, controlled outside motion_acq).
# Values marked VERIFY must be checked on the station before real teleop.

station: arm5080

cameras: {}

recording:
  device: meta
  cameras: []
  fps: 30
  robot: openarmv1

robots:
  openarmv1:
    backend: openarm_can
    gripper:
      enabled: false
    can:
      # arm5080: OpenArm not connected yet; expected on can2/can3. VERIFY which is left/right.
      fd: true
      bitrate: 1000000
      dbitrate: 5000000
      left_port: can3
      right_port: can2
      auto_repair: true

meta_quest:
  connection:
    quest_ip: ""  # VERIFY: set this station's Quest IP; until then pass --quest-ip
    tcp_port: 65432
    sync_port: 42000
    connect_retry_s: 1.0
  health:
    frame_stale_timeout_s: 0.25
