# Station rig for arm5080. Select with: MACQ_STATION=arm5080 macq <command>
# STEP 1 scope: Meta Quest -> OpenArm arms (J1-J7) only. Both CAN buses answer
# J8 (gripper motor) too; motion_acq leaves it untouched (gripper.enabled false).
# RH56F1 hands are to be connected later and controlled outside motion_acq.
# No head section: this station has no head yet (macq head runs fake only).
# Values marked VERIFY must be checked on the station before real teleop.

station: arm5080

cameras: {}

recording:
  device: meta
  cameras: []
  fps: 30
  robot: openarmv1

robots:
  openarmv1:
    backend: openarm_can
    gripper:
      enabled: false
    can:
      # arm5080: one PCAN-USB Pro FD, ch1 = can0 and ch2 = can1 (no udev renames).
      # Same convention as arm4090 (can0 = right, can1 = left). VERIFY the wiring
      # with openarm-can-cli show_param before real teleop.
      fd: true
      bitrate: 1000000
      dbitrate: 5000000
      left_port: can1
      right_port: can0
      auto_repair: true

meta_quest:
  connection:
    # Wired (default): scripts/quest_usb.sh forward, then 127.0.0.1.
    # Wi-Fi: put this station's Quest IP here instead.
    quest_ip: "127.0.0.1"
    tcp_port: 65432
    sync_port: 42000
    connect_retry_s: 1.0
  health:
    frame_stale_timeout_s: 0.25
