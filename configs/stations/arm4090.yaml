# Station rig for arm4090. Select with: MACQ_STATION=arm4090 macq <command>
# STEP 1 scope: Meta Quest -> OpenArm arms (J1-J7) only. The OpenArm J8
# gripper motor is not connected; the end effector is RH56F1 (both arms, EtherCAT, controlled outside motion_acq).
# Values marked VERIFY must be checked on the station before real teleop.

station: arm4090

cameras: {}

recording:
  device: meta
  cameras: []
  fps: 30
  robot: openarm_rh56f1
  # Head and hand processes stream to the recorder over UDP (localhost); every
  # listed stream is required while recording. Start them with
  #   macq head --udp-target 127.0.0.1:47101
  #   hand_node -p udp_target:=127.0.0.1:47111 (right) / 47112 (left)
  # or record arms only with teleop-record --no-sidecars.
  sidecars:
    head: 47101
    hand_right: 47111
    hand_left: 47112

robots:
  openarm_rh56f1:
    backend: openarm_can
    home_pose: rh56f1_aglt  # sim2real home (hands open); start anchor for teleop
    gripper:
      enabled: false
    can:
      # arm4090: can0 = right arm, can1 = left arm (PCAN-USB Pro FD, sim2real docs/HOST_arm4090.md).
      # The s2r stack owns these links: never reconfigure them from motion_acq.
      fd: true
      bitrate: 1000000
      dbitrate: 5000000
      left_port: can1
      right_port: can0
      auto_repair: false

meta_quest:
  connection:
    # Wired (default): scripts/quest_usb.sh forward, then 127.0.0.1.
    # Wi-Fi: put this station's Quest IP here instead.
    quest_ip: "127.0.0.1"
    tcp_port: 65432
    sync_port: 42000
    connect_retry_s: 1.0
  health:
    frame_stale_timeout_s: 0.25

# STEP 2 head: XC330 x2 on a U2D2. Values from sim2real config/head_home_rh56f1.yaml
# (home pose matching the 5090 view, motor EEPROM Homing Offset pan +1024 / tilt -1024).
# The serial port is shared with s2r: only one process may open it at a time.
head:
  port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT763P8T-if00-port0
  baud: 1000000
  rate_hz: 50
  pan:
    id: 1
    home_deg: -2.9
    range_deg: 20.0   # STEP 2 first window; widen after verification
    sign: 1           # VERIFY with --axes pan: HMD yaw left must turn the camera left
  tilt:
    id: 2
    home_deg: 71.8
    range_deg: 15.0
    sign: 1           # VERIFY with --axes tilt: HMD pitch up must raise the camera
  motor:
    model_number: 1240        # XC330-M288-T
    operating_mode: 3         # position control
    position_i_gain: 400      # written after the mode (mode write resets gains)
    profile_acceleration: 20
    profile_velocity: 50
    start_tolerance_deg: 2.0  # refuse to start if the head sits outside the window
  filter:
    deadband_deg: 0.5
    min_cutoff_hz: 1.0
    beta: 0.05
    d_cutoff_hz: 1.0
  limits:
    max_velocity_deg_s: 60.0
    max_acceleration_deg_s2: 300.0

# STEP 3 hands: Nova 2 serials as senseglove_ros names them
# (/senseglove/glove<serial>/<rh|lh>/senseglove_states). VERIFY after pairing
# the gloves in SenseCom; macq station --real refuses empty serials.
hands:
  right: {glove_serial: ""}
  left: {glove_serial: ""}
