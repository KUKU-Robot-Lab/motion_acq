# Nova 2 glove -> RH56F1 hand retargeting (STEP 3).
#
# 10.05 method (user: the open/fist calibration moved the wrong fingers): the
# operator holds every example pose below once (per user and side, kept in
# configs/hands/calibration/<user>_<side>.yaml and reused); each example has the
# robot pose the hand should take. motion_acq.hand.example_map fits the glove
# inputs -> 6 RH56F1 joints from those samples (affine ridge + a Gaussian term per
# example). Why examples: the glove signals are coupled (10.05 left log: bending
# the ring finger moved the glove's thumb rotation reading, corr 0.41; curling a
# finger brought its tip to a still thumb, corr 0.81-0.93), and "index curled,
# thumb still" teaches the map to keep them apart. After a SenseCom restart or a
# glove power cycle, a 2 s open-hand re-zero shifts the inputs (calibrate --rezero).
# The four finger groups map each robot finger from its own glove finger, so moving one
# finger cannot move another robot finger.
#
# The joint values, then One Euro filtered and rate limited, go to registers with
# rh56f1_hand_map.yaml (per-side calibration).

# Retargeting method (10.06 user: retarget the Nova 2 hand onto the RH56F1).
#   kinematic: the glove's hand model (knuckles, fingertips) is aligned to the robot hand
#     from the open hand (calibration or [편 손 맞춤]) and each tick the robot joints are
#     the ones whose fingertips best match the operator's (motion_acq.hand.kinematic;
#     pinches put the tips together). Falls back to the example map on a tick without
#     hand model data or while the calibration has no alignment yet.
#   examples: the example-pose map below only.
method: kinematic
# Reference at [켜기] (10.06 user): when the robot hand reaches home (fingers straight, thumb
# beside the index), the operator holds that same pose still for `seconds`; the take
# re-zeroes the saved map and re-aligns the glove hand model, then the hand follows the glove.
# Not held still within timeout_s: follows the saved calibration (shown in the console).
reference: {pose: flat, seconds: 1.0, timeout_s: 10.0}
kinematic:
  near_m: 0.045      # operator thumb-to-finger distance (robot scale) where the pinch term starts
  touch_m: 0.015     # ... and where the robot tips are put together
  pinch_weight: 8.0
  smooth_weight: 0.0002
  # thumb_2 toward the operator's own thumb bend (glove thumb_pip, 0 at open/flat .. 1 at thumb_bend).
  # Offline on the 10.06 left log (scratch sweep, bend prior weight w): w 0 -> corr(thumb_2, bend)
  # 0.07, thumb tip error 6 mm; 0.01 -> 0.81 / 10 mm; 0.03 -> 0.96 / 18 mm. Pinch terms (weight 8)
  # still dominate near a pinch.
  # 10.06 evening user (left and right teleop): thumb_2 hardly moved on its own (target 0..0.27 of 0.47 rad,
  # corr with thumb_1 0.43-0.60) -> 0.03.
  thumb_bend_weight: 0.03

# One map per joint group, each from the glove inputs that group needs (10.05 left
# test: with all inputs in one map the thumb rotation sat at 1.2-1.7 rad, since a pose
# away from every example falls back to the affine average). dip is not used
# (senseglove_ros reports it equal to pip), nor pinky_* (no little-finger sensor: equal
# to ring_*) or the finger brakes (always 0). tipdist_*: thumb-to-finger tip distance and
# thumb_tip_*: thumb tip position, both from SenseGloveState.finger_tip_position (SGCore
# hand model, mm, hand frame). The thumb tip position is what drives thumb_1: the glove's
# thumb_brake saturates (0.95-1.01 in the thumb bent, opposed and every pinch pose). A
# glove without tip data uses the open pose's values for them.
groups:
  thumb:
    joints: [thumb_1, thumb_2]
    inputs: [thumb_brake, thumb_mcp, thumb_pip, thumb_tip_x, thumb_tip_y, thumb_tip_z,
             tipdist_index, tipdist_middle, tipdist_ring, tipdist_pinky]
  # a finger also sees the thumb tip: "finger curled" and "pinching that finger" curl the
  # glove finger alike (10.05 calibration: index / pinch_index 0.55-0.97 apart, flagged on
  # both hands), the thumb position is what differs
  index:
    joints: [index_1]
    inputs: [index_mcp, index_pip, tipdist_index, thumb_tip_x, thumb_tip_y, thumb_tip_z]
  middle:
    joints: [middle_1]
    inputs: [middle_mcp, middle_pip, tipdist_middle, thumb_tip_x, thumb_tip_y, thumb_tip_z]
  ring:
    joints: [ring_1, pinky_1]
    inputs: [ring_mcp, ring_pip, tipdist_ring, thumb_tip_x, thumb_tip_y, thumb_tip_z]

# RH56F1 joint range the map may command (rad). thumb_1: larger = register down =
# across the palm (verified 10.05 on the right hand: 852 -> 620 toward the palm,
# 852 -> 1138 away); 2.09 is register ~552 right (clipped to 600) / ~669 left.
limits_rad:
  thumb_1: [0.6, 2.0943951]
  thumb_2: [0.0, 0.474555]
  index_1: [0.0, 1.5285594]
  middle_1: [0.0, 1.5285594]
  ring_1: [0.0, 1.5285594]
  pinky_1: [0.0, 1.5285594]

# Example poses: what the operator does (Korean prompt) -> where the robot goes.
# The pinch targets are where the RH56F1 thumb tip meets that finger tip (vendor
# URDF FK, python -m motion_acq.hand.fk; the little finger cannot be reached, 30 mm),
# ~0.03 rad past the touch so the tips press. 'open' is also the re-zero pose.
examples:
  open:
    prompt: "손 펴기: 다섯 손가락을 쭉 펴고, 엄지는 검지에서 멀리 옆으로 벌린다"
    target: {thumb_1: 0.8, thumb_2: 0.0, index_1: 0.0, middle_1: 0.0, ring_1: 0.0, pinky_1: 0.0}
  flat:
    prompt: "손 펴고 엄지 붙이기: 다섯 손가락을 편 채, 엄지를 검지 옆에 나란히 붙인다"
    target: {thumb_1: 1.57, thumb_2: 0.0, index_1: 0.0, middle_1: 0.0, ring_1: 0.0, pinky_1: 0.0}
  fist:
    prompt: "주먹: 네 손가락을 끝까지 말아 쥐고, 엄지도 굽혀 검지·중지 위를 덮는다"
    target: {thumb_1: 1.57, thumb_2: 0.474555, index_1: 1.5285594, middle_1: 1.5285594, ring_1: 1.5285594, pinky_1: 1.5285594}
  index:
    prompt: "검지만 굽히기: 검지만 끝까지 굽히고, 나머지 손가락과 엄지(검지 옆에 붙인 채)는 편다"
    target: {thumb_1: 1.57, thumb_2: 0.0, index_1: 1.5285594, middle_1: 0.0, ring_1: 0.0, pinky_1: 0.0}
  middle:
    prompt: "중지만 굽히기: 중지만 끝까지 굽히고, 나머지 손가락과 엄지는 편다"
    target: {thumb_1: 1.57, thumb_2: 0.0, index_1: 0.0, middle_1: 1.5285594, ring_1: 0.0, pinky_1: 0.0}
  ring:
    prompt: "약지·새끼 굽히기: 약지와 새끼를 끝까지 굽히고, 검지·중지와 엄지는 편다"
    target: {thumb_1: 1.57, thumb_2: 0.0, index_1: 0.0, middle_1: 0.0, ring_1: 1.5285594, pinky_1: 1.5285594}
  thumb_bend:
    prompt: "엄지만 굽히기: 네 손가락은 편 채, 엄지만 손바닥 쪽으로 끝까지 굽힌다"
    target: {thumb_1: 1.57, thumb_2: 0.474555, index_1: 0.0, middle_1: 0.0, ring_1: 0.0, pinky_1: 0.0}
  thumb_opposed:
    prompt: "엄지 맞대기: 네 손가락은 편 채, 엄지 끝을 새끼손가락 뿌리(손바닥 아래 끝)에 댄다"
    target: {thumb_1: 2.0, thumb_2: 0.25, index_1: 0.0, middle_1: 0.0, ring_1: 0.0, pinky_1: 0.0}
  pinch_index:
    prompt: "엄지-검지 집기: 엄지 끝과 검지 끝을 맞댄다 (나머지 손가락은 편다)"
    target: {thumb_1: 1.54, thumb_2: 0.19, index_1: 0.73, middle_1: 0.0, ring_1: 0.0, pinky_1: 0.0}
  pinch_middle:
    prompt: "엄지-중지 집기: 엄지 끝과 중지 끝을 맞댄다 (나머지 손가락은 편다)"
    target: {thumb_1: 1.93, thumb_2: 0.15, index_1: 0.0, middle_1: 0.76, ring_1: 0.0, pinky_1: 0.0}
  pinch_ring:
    prompt: "엄지-약지 집기: 엄지 끝과 약지 끝을 맞댄다 (새끼는 같이 굽어도 된다)"
    target: {thumb_1: 2.0943951, thumb_2: 0.11, index_1: 0.0, middle_1: 0.0, ring_1: 0.78, pinky_1: 0.78}

# sim2real contract hand_home: RH56F1 open (thumb_1 1.57, the rest 0).
home_rad: {thumb_1: 1.57, thumb_2: 0.0, index_1: 0.0, middle_1: 0.0, ring_1: 0.0, pinky_1: 0.0}

# 10.05 user test: the hand lagged the glove by 220-350 ms, 160-270 ms of it
# here (a 1.5 Hz One Euro filter and a 2.0 rad/s limit). The glove is quiet
# (still-hand noise 0.0005-0.0016 rad per joint, under one register), so the
# filter only guards single-sample glitches now and the limit stays above the
# RH56F1's own ~2.4 rad/s (speed 2000, sim2real 09.30): replaying the 10.05
# logs, glove -> command lag 0-8 ms (was 75-283 ms). What is left is the hand
# itself (~60 ms dead time + ~100 ms rise, sim2real RH56F1_TUNING_0930) and
# EtherCAT at 500 Hz.
filter: {min_cutoff_hz: 20.0, beta: 0.0, d_cutoff_hz: 1.0}
limits: {max_velocity_rad_s: 8.0, max_acceleration_rad_s2: 400.0, max_step_dt_s: 0.1}
rate_hz: 120.0     # = sim2real RH56F1 EtherCAT hand command rate (10.03); glove 60 Hz -> 2 ticks per sample
stale_s: 0.2       # no glove sample for this long -> HOLD
driver:
  speed: 2000      # SetSpeed1, same as sim2real pd hw_speed
  force: 600       # SetForce1 [g], same as sim2real pd hw_force
  # 10.06 user: one hand control logic for teleop and policies, in the EtherCAT driver at 500 Hz.
  # angle_target = the driver's per-finger admittance (sim2real cd542da, rh56f1_ports.yaml admittance);
  # angle_set = plain position (then admittance.enabled below can run the 120 Hz motion_acq version).
  command: angle_target

# Admittance per finger (motion_acq.hand.admittance; 10.06 user: position + force loop together, not
# switched; linkage, non-backdrivable lead screw -> admittance, not impedance). Every tick:
#   q_cmd = q_operator - y,  y <- y + a (f / stiffness - y),  a = dt / (filter_tau + dt)
# f = actuator force over rest - deadband (x 1/proximal_scale while the tip sensor is quiet: link 1 contact).
# Free space: f ~ 0, the finger follows the glove. Contact: grip force ~ stiffness x how far the operator
# closes past the contact, whatever the object (a position offset alone gave 3-55 g/register, 10.06).
# Loop gain per tick ~ a * k_contact / stiffness (k_contact up to ~29 kg/rad on thumb_2): tau 0.15 s at
# 120 Hz -> a 0.016. thumb_1 stays with the grip guard only (its force reads negative under an outward load).
# The firmware stays in mode 0 (mode switches over SDO are refused in OP, 10.06 right index).
admittance:
  enabled: false   # the driver's admittance runs instead (driver.command angle_target)
  joints: [index_1, middle_1, ring_1, pinky_1, thumb_2]
  stiffness_g_per_rad: 2000.0
  deadband_g: 40.0
  filter_tau_s: 1.0       # 10.06 right index on a cup: 0.5 s limit-cycled 100-440 g (contact ~55 kg/rad, 1 reg ~100 g); sim: 1.0 settles to 1 register
  release_tau_s: 0.15     # once the force is gone the offset fades in ~0.5 s (simulated)
  rate_on_g: 60.0         # from this force (over the deadband) the command closes at <= rate_rad_s x (1 - f / max_force),
  rate_rad_s: 0.3         # restarting from the measured angle (10.06: a lead cap held a rigid cup at ~350 g)
  max_force_g: 800.0              # above: backs off at over_stiffness (soft ceiling ~800 g + 200 g/rad)
  over_stiffness_g_per_rad: 200.0
  max_offset_rad: 1.6
  proximal_scale: 1.0     # 10.06 user (A): no link 1 boost, the actuator reading is the grip force
  tip_contact_n: 0.2

# Grip guard (motion_acq.hand.grip_guard; 10.06 user: the hand must protect itself, the haptics
# alone are too slow). 10.06 cup grasp: fingers blocked by the cup kept pushing to the glove's
# fist target, force_actual 1346-1715 g against force_set 600, 6.5 A in total (manual max grip
# 4.0 A, spec peak 5 A @ 24 V), then the hand froze locked closed. Free motion in that run drew
# <= 320 mA per actuator and < 250 g. Per joint: pressing (force >= force_on_g or current >=
# current_on_ma) -> the command closes no further than measured + margin_rad; above the hard
# levels, or all six together above total_current_ma -> measured - backoff_rad. Opening is never
# limited. Released when force < force_off_g and current < current_off_ma.
grip_guard:
  enabled: true
  force_on_g: 950.0     # safety above the admittance ceiling (~800 g): hold
  force_off_g: 700.0
  force_hard_g: 1100.0
  current_on_ma: 800.0
  current_off_ma: 500.0
  current_hard_ma: 1100.0
  total_current_ma: 3500.0
  margin_rad: 0.03
  backoff_rad: 0.03
  stale_s: 0.3
  # Contact speed (Tan, Xie, Correll, arXiv 2603.08988, Inspire RH56DFX): the hand does not slow
  # before contact and its force overshoot grows with speed (+1618 % at full speed, small at 1/40
  # of it). From the first sign of contact (tip >= contact_tip_n, force over rest >=
  # contact_force_g, or current >= contact_current_ma) that joint runs at contact_speed (SetSpeed1,
  # 2000 = full stroke in 1 s) until all three fall below half. To be tuned on the real hand
  # (scripts/hand_contact_probe.py measures overshoot per speed).
  contact_speed: 300.0
  contact_force_g: 120.0
  contact_current_ma: 450.0
  contact_tip_n: 0.2
  bias_samples: 50.0   # force readings at rest (home, during the reference take) before the bias is used

# RH56F1 sensors -> Nova 2 haptics (motion_acq.hand.feedback; 10.05 user: the
# glove limits the operator to what the hand can do and shows contact). Only
# while the hand follows the glove; all off otherwise and when the node exits.
# Brakes act on flexion only (thumb, index, middle, ring; pinky -> ring).
# Starting values, to be tuned on the worn glove.
feedback:
  # 10.06 evening user (left and right teleop): the glove brakes got in the way of the motion -> off.
  enabled: false
  tip_on_n: 0.3          # robot tip force where the glove brake starts (N)
  tip_full_n: 3.0        # ... and where it is full
  joint_force_on: 150    # RH56F1 joint force (force_actual) while its command is ahead: robot finger held back
  joint_force_full: 450  # free motion stays under ~70 (sim2real RH56F1_TUNING_0930); force limit 600
  press_rad: 0.05        # command ahead of position by this before the joint force counts
  limit_rad: 0.03        # command within this of the closed end: the robot finger cannot curl further
  limit_level: 1.0       # brake level then (0 = do not limit at the closed end)
  brake_on: 0.15         # hysteresis: a brake starts at this level and releases below brake_off
  brake_off: 0.05
  max_brake: 1.0
  palm_on_n: 0.5         # palm contact -> wrist strap squeeze
  palm_full_n: 5.0
  max_squeeze: 0.5
  pulse_s: 0.08          # first touch of a finger: vibration pulse
  pulse_level: 0.6
  sensor_stale_s: 0.3
  # 10.05 user: the strap squeeze holds the glove on the palm so it sits the same
  # way in calibration and in use. This level while following the glove and while
  # calibrating (0 = off); contact squeeze adds on top, up to max_squeeze.
  strap_hold: 0.2
