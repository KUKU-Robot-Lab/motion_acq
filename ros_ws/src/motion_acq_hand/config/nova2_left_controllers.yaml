# Nova 2 left glove controllers: senseglove_ros humble-dev a14a468
# senseglove_hardware_interface/config/nova2_left/controllers.yaml with haptics_controller
# replaced (10.05): upstream used a JointTrajectoryController whose effort is a PID on a
# position error, so a brake level could not be commanded. Here it is a
# forward_command_controller: std_msgs/Float64MultiArray on <ns>/haptics_controller/commands,
# percent (0..100) per joint in this order = motion_acq.hand.feedback.HAPTIC_JOINTS.
# The glove driver patch (ros_ws/patches/senseglove_ros_haptics_levels.patch) passes the
# levels on graded (upstream sent any value as full and nothing under a 10 % sum).
/**/controller_manager:
  ros__parameters:
    update_rate: 60

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

/**/senseglove_state_broadcaster:
  ros__parameters:
    type: senseglove_state_broadcaster/SenseGloveStateBroadcaster
    topic_name: senseglove_states
    frame_id: world
    joints:
      - l_thumb_mcp
      - l_thumb_pip
      - l_thumb_dip
      - l_thumb_brake
      - l_index_mcp
      - l_index_pip
      - l_index_dip
      - l_index_brake
      - l_middle_mcp
      - l_middle_pip
      - l_middle_dip
      - l_middle_brake
      - l_ring_mcp
      - l_ring_pip
      - l_ring_dip
      - l_ring_brake
      - l_pinky_mcp
      - l_pinky_pip
      - l_pinky_dip
      - l_pinky_brake

/**/haptics_controller:
  ros__parameters:
    type: forward_command_controller/ForwardCommandController
    interface_name: effort
    joints:
      - l_thumb_brake   # brake (flexion)
      - l_index_brake   # brake
      - l_middle_brake  # brake
      - l_ring_brake    # brake
      - l_palm_strap    # wrist strap squeeze
      - l_thumb_dip     # vibration: thumb tip
      - l_index_dip     # vibration: index tip
      - l_palm_index    # vibration: palm, index side
      - l_palm_pinky    # vibration: palm, pinky side
