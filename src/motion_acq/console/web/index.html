<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>macq 콘솔</title>
<link rel="stylesheet" href="/static/console.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></symbol>
  <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="currentColor"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7.1 6.5a7 7 0 1 0 9.8 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>

<header id="top">
  <div class="brand"><span class="logo">macq</span><span class="brand-sub">콘솔</span></div>
  <span id="station" class="badge">-</span>
  <div class="seg" role="radiogroup" aria-label="모드">
    <button type="button" data-mode="fake" role="radio">FAKE</button>
    <button type="button" data-mode="real" role="radio">실기</button>
  </div>
  <span id="conn" class="badge" aria-live="polite">연결 중</span>
  <div id="health" aria-label="장치 상태"></div>
  <span class="spacer"></span>
  <label class="field pilot">파일럿 <input type="text" id="user" maxlength="32" placeholder="이름 (예: op1)" autocomplete="off"></label>
  <button type="button" id="theme" class="icon-btn" aria-label="밝게/어둡게"><svg><use href="#i-sun"/></svg></button>
  <button type="button" id="quit" class="btn ghost"><svg><use href="#i-power"/></svg>콘솔 종료</button>
</header>

<section id="alerts" aria-live="assertive"></section>

<main id="stage">
  <section id="body" aria-label="장비">
    <div class="zone" id="zone-op">
      <h2 class="zone-title">조작자</h2>
      <svg class="figure" viewBox="0 0 600 300" preserveAspectRatio="none" aria-hidden="true">
        <path d="M300 70 V150 M150 150 H450 M150 150 L110 250 M450 150 L490 250"/>
      </svg>
      <div class="node-grid op">
        <article class="node" data-node="quest" style="grid-area: head" tabindex="0"></article>
        <article class="node" data-node="neck" style="grid-area: neck" tabindex="0"></article>
        <article class="node" data-node="glove_left" style="grid-area: lhand" tabindex="0"></article>
        <article class="node" data-node="glove_right" style="grid-area: rhand" tabindex="0"></article>
      </div>
    </div>

    <div class="zone" id="zone-robot">
      <h2 class="zone-title">로봇</h2>
      <svg class="figure" viewBox="0 0 600 260" preserveAspectRatio="none" aria-hidden="true">
        <path d="M110 60 H490 M110 60 V200 M490 60 V200"/>
      </svg>
      <div class="node-grid robot">
        <article class="node" data-node="arm_left" style="grid-area: larm" tabindex="0"></article>
        <div class="arm-ctrl" style="grid-area: ctrl" id="arm-ctrl"></div>
        <article class="node" data-node="arm_right" style="grid-area: rarm" tabindex="0"></article>
        <article class="node" data-node="hand_left" style="grid-area: lhand" tabindex="0"></article>
        <article class="node" data-node="hand_right" style="grid-area: rhand" tabindex="0"></article>
      </div>
    </div>

    <div class="zone" id="zone-rec">
      <h2 class="zone-title">녹화</h2>
      <article class="node rec" data-node="record" tabindex="0"></article>
    </div>
  </section>

  <aside id="detail" aria-label="자세히"></aside>
</main>

<footer id="bar">
  <div id="running" class="chips" aria-label="실행 중"></div>
  <span class="spacer"></span>
  <label class="field inline">Space 대상
    <select id="space-target"><option value="">없음</option><option value="arm">팔</option><option value="head">목</option><option value="record">녹화</option></select>
  </label>
  <button type="button" id="stop-all" class="btn danger big"><svg><use href="#i-stop"/></svg>모두 정지 (안전 자세)</button>
</footer>

<aside id="drawer" hidden aria-label="전체 로그">
  <header><h2 id="drawer-title">로그</h2><span class="meta" id="drawer-path"></span><span class="spacer"></span>
    <button type="button" class="btn ghost danger-text" id="drawer-force">강제 종료</button>
    <button type="button" class="icon-btn" id="drawer-close" aria-label="닫기">&times;</button></header>
  <pre id="drawer-log"></pre>
  <form id="drawer-input" class="row"><input type="text" id="drawer-text" maxlength="80" placeholder="입력 보내기 (Enter 포함)" autocomplete="off"><button type="submit" class="btn">보내기</button></form>
</aside>

<dialog id="confirm">
  <form method="dialog">
    <h2 id="confirm-title">확인</h2>
    <p id="confirm-summary"></p>
    <pre id="confirm-command"></pre>
    <div class="actions end">
      <button value="cancel" class="btn" autofocus>취소</button>
      <button value="ok" class="btn danger" id="confirm-ok">실행</button>
    </div>
  </form>
</dialog>

<div id="toasts" aria-live="polite"></div>
<script src="/static/console.js"></script>
</body>
</html>
